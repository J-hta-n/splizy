name: Close issues on dev merge

on:
  workflow_dispatch:
  pull_request:
    types: [closed]
    branches: [dev]

jobs:
  close-linked-issues:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: read

    steps:
      - name: Close issues referenced in PR description
        uses: actions/github-script@v7
        with:
          script: |
            if (context.eventName !== 'pull_request') {
              core.info('Manual run detected; this workflow only closes issues from merged pull_request events.');
              return;
            }

            const body = context.payload.pull_request.body || '';
            const pr = context.payload.pull_request;
            const keywordRegex = /\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+((?:[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+)?#\d+)\b/gi;

            const refs = [...body.matchAll(keywordRegex)].map((m) => m[1]);

            if (refs.length === 0) {
              core.info('No closing keywords found in PR description.');
              return;
            }

            const uniqueRefs = [...new Set(refs.map((ref) => ref.trim()))];

            const parseRef = (ref) => {
              if (ref.includes('/')) {
                const [repoPart, issuePart] = ref.split('#');
                const [owner, repo] = repoPart.split('/');
                return { owner, repo, issue_number: Number(issuePart) };
              }

              return {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: Number(ref.replace('#', '')),
              };
            };

            for (const ref of uniqueRefs) {
              const target = parseRef(ref);

              if (!target.issue_number || Number.isNaN(target.issue_number)) {
                core.warning(`Skipping invalid issue reference: ${ref}`);
                continue;
              }

              try {
                const issue = await github.rest.issues.get(target);

                if (issue.data.state === 'closed') {
                  core.info(`Issue already closed: ${target.owner}/${target.repo}#${target.issue_number}`);
                  continue;
                }

                await github.rest.issues.update({
                  ...target,
                  state: 'closed',
                  state_reason: 'completed',
                });

                await github.rest.issues.createComment({
                  ...target,
                  body: `Closed automatically by merged PR #${pr.number} (${pr.html_url}) into \`dev\`.`,
                });

                core.info(`Closed issue: ${target.owner}/${target.repo}#${target.issue_number}`);
              } catch (error) {
                core.warning(`Could not close ${ref}: ${error.message}`);
              }
            }
